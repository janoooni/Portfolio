<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%23ff7d3c'/%3E%3C/svg%3E"/>
  <title>Janani - Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; }
    :root { --bg:#fa344f; --fg:#fff; }
    body.dark { --bg:#141414; }
    body {
      background:var(--bg);
      font-family:'Inter',sans-serif;
      cursor:none;
      min-height:100vh;
      overflow:hidden;
      position:relative;
      transition:background 0.4s;
    }

    /* Cursor */
    #cursor {
      position:fixed; left:-100px; top:-100px; width:28px; height:28px; border-radius:50%;
      background:rgba(255,255,255,0.5); pointer-events:none;
      transform:translate(-50%,-50%); z-index:9999; will-change:transform;
    }
    #cursor.clicked    { opacity:0; transition:opacity 0s; }
    #cursor.recovering { opacity:1; transition:opacity 0.15s ease; }
    #home-btn {
      position:fixed; top:16px; left:16px; z-index:8600;
      width:32px; height:32px; border-radius:50%;
      background:rgba(255,255,255,0.15); cursor:none;
      display:flex; align-items:center; justify-content:center;
      transition:background 0.2s ease;
    }
    #home-btn:hover { background:rgba(255,255,255,0.25); }
    #home-btn-shape {
      display:inline-block; width:0; height:0;
      border-left:6px solid transparent; border-right:6px solid transparent;
      border-bottom:10px solid var(--fg);
    }
    #home-btn:hover #home-btn-shape { animation:home-btn-spin 0.7s linear infinite; }
    @keyframes home-btn-spin {
      from { transform:rotate(0deg); }
      to   { transform:rotate(360deg); }
    }
    @keyframes home-btn-pop {
      0%   { transform:scale(1) rotate(0deg); opacity:1; }
      20%  { transform:scale(1.35) rotate(0deg); opacity:1; }
      45%  { transform:scale(0.05) rotate(0deg); opacity:0.7; }
      100% { transform:scale(0) rotate(0deg); opacity:0; }
    }
    #home-btn.popping #home-btn-shape { animation:home-btn-pop 0.38s cubic-bezier(0.55,0.06,0.68,0.19) forwards; }

    /* Hamburger */
    #menu-btn { position:fixed; top:36px; right:44px; z-index:8600; cursor:none; display:flex; flex-direction:column; gap:6px; padding:8px; }
    #menu-btn span { display:block; width:28px; height:2.5px; background:var(--fg,#fff); border-radius:99px; transition:transform 0.3s,opacity 0.3s; transform-origin:center; }
    #menu-btn.open span:nth-child(1) { transform:translateY(8.5px) rotate(45deg); }
    #menu-btn.open span:nth-child(2) { opacity:0; transform:scaleX(0); }
    #menu-btn.open span:nth-child(3) { transform:translateY(-8.5px) rotate(-45deg); }
    #nav-dropdown { position:fixed; top:92px; right:44px; z-index:8700; display:flex; flex-direction:column; align-items:flex-end; pointer-events:none; opacity:0; transform:translateY(-8px); transition:opacity 0.25s,transform 0.25s; }
    #nav-dropdown.open { opacity:1; transform:translateY(0); pointer-events:all; }
    .nav-item { font-weight:500; font-size:28px; color:var(--fg,#fff); letter-spacing:-1.4px; text-transform:lowercase; line-height:1.25; cursor:none; text-decoration:none; opacity:0.9; transition:opacity 0.15s; }
    .nav-item:hover, .nav-item.current { opacity:1; }
    #work-subpages { display:flex; flex-direction:column; align-items:flex-end; overflow:hidden; max-height:0; opacity:0; transition:max-height 0.35s ease,opacity 0.3s ease; }
    #work-subpages.open { max-height:220px; opacity:1; }
    .sub-item { font-weight:500; font-size:19px; color:var(--fg,#fff); letter-spacing:-0.9px; text-transform:lowercase; line-height:1.35; cursor:none; text-decoration:none; opacity:0.6; transition:opacity 0.15s; }
    .sub-item:hover, .sub-item.current { opacity:1; }
    .nav-triangle {
      display:inline-block; width:0; height:0;
      border-left:6px solid transparent; border-right:6px solid transparent;
      border-bottom:9px solid var(--fg);
      flex-shrink:0;
    }
    @keyframes nav-triangle-pop {
      0%   { transform:scale(1); }
      40%  { transform:scale(1.7); }
      70%  { transform:scale(0.82); }
      100% { transform:scale(1); }
    }
    .nav-triangle.pop { animation:nav-triangle-pop 0.4s cubic-bezier(0.34,1.56,0.64,1); }


    /* Dark toggle */
    #dark-toggle {
      position:fixed; bottom:36px; right:44px; z-index:8600; cursor:none;
      width:36px; height:20px; background:rgba(255,255,255,0.25); border-radius:99px;
      transition:background 0.3s;
    }
    #dark-toggle::after {
      content:''; position:absolute; width:14px; height:14px;
      border-radius:50%; background:#fff; top:3px; left:3px; transition:transform 0.3s;
    }
    body.dark #dark-toggle { background:rgba(255,125,60,0.55); }
    body.dark #dark-toggle::after { transform:translateX(16px); }

    #site-copyright {
      position:fixed; bottom:36px; left:54px; z-index:30;
      font-size:11px; font-weight:400; color:rgba(255,255,255,0.3);
      letter-spacing:-0.1px; pointer-events:none;
    }
    body.dark #site-copyright { color:rgba(255,255,255,0.2); }

    /* Page transition overlay */
    #t-overlay {
      position:fixed; inset:0; background:var(--bg);
      opacity:1; pointer-events:none; z-index:8000; transition:opacity 0.5s;
    }
    #t-overlay.clear { opacity:0; }

    /* ── CONTACT LABEL ── */
    #contact-label {
      position:absolute;
      left:54px; top:44px;
      font-weight:600; font-size:32px;
      letter-spacing:-1.6px; text-transform:lowercase;
      color:rgba(255,163,174,0.7);
      opacity:0;
      transition:opacity 0.4s;
    }
    body.dark #contact-label { color:rgba(255,255,255,0.3); }

    /* ── HEADING ── */
    #heading-wrap {
      position:absolute;
      left:54px; top:169px;
    }
    #heading {
      font-weight:600; font-size:clamp(40px,5vw,72px);
      letter-spacing:-3px; text-transform:lowercase;
      color:#fff; line-height:1.05;
      white-space:nowrap;
    }
    #tw-cursor {
      display:inline-block; width:3px; height:0.9em;
      background:#fff; margin-left:2px; vertical-align:middle;
      animation:twblink 0.7s step-end infinite;
    }
    #tw-cursor.hidden { display:none; }
    @keyframes twblink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── SQUIGGLY LINE ── */
    #squiggle-wrap {
      position:absolute;
      left:0; right:0;
      top:45%;
      transform:translateY(-50%);
      pointer-events:none;
      z-index:1;
    }
    #squiggle-svg {
      width:100%; height:120px; display:block;
      overflow:visible;
    }
    #squiggle-path {
      fill:none;
      stroke:#fff;
      stroke-width:2.5;
      stroke-linecap:round;
      opacity:0.55;
      transition:stroke 0.3s;
    }
    body.dark #squiggle-path { stroke:rgba(255,255,255,0.4); }

    /* ── BUTTONS ── */
    #buttons-wrap {
      position:absolute;
      bottom:12%;
      right:8%;
      width:500px; height:340px;
      pointer-events:none;
    }

    .contact-btn {
      position:absolute;
      display:flex; align-items:center; justify-content:center;
      border-radius:16px;
      font-weight:300; font-size:28px;
      letter-spacing:-1.4px; color:#fff;
      cursor:none; pointer-events:all;
      border:1.5px solid transparent;
      user-select:none;
      opacity:0;
    }
    .contact-btn:active { filter:brightness(0.9); }

    .contact-btn.landed { opacity:1; }

    #btn-email {
      width:260px; height:52px;
      background:#ff6e82; border-color:#861322;
      left:20px; bottom:60px;
      transform: rotate(-9.49deg) translateY(-160px);
    }
    #btn-linkedin {
      width:135px; height:52px;
      background:#68874d; border-color:#112202;
      left:265px; bottom:155px;
      transform: rotate(8.6deg) translateY(-160px);
    }
    #btn-instagram {
      width:159px; height:52px;
      background:#c62137; border-color:#861322;
      left:320px; bottom:20px;
      transform: rotate(24.07deg) translateY(-160px);
    }
    #btn-coffee {
      width:190px; height:52px;
      background:#9bc675; border-color:#3f5c26;
      left:30px; bottom:225px;
      transform: rotate(-14.2deg) translateY(-160px);
    }

    /* Button wiggle on hover */
    @keyframes btn-wiggle {
      0%   { transform: rotate(var(--base-rot)) translateX(0); }
      15%  { transform: rotate(calc(var(--base-rot) + 6deg)) translateX(-4px); }
      30%  { transform: rotate(calc(var(--base-rot) - 5deg)) translateX(4px); }
      45%  { transform: rotate(calc(var(--base-rot) + 4deg)) translateX(-3px); }
      60%  { transform: rotate(calc(var(--base-rot) - 3deg)) translateX(2px); }
      75%  { transform: rotate(calc(var(--base-rot) + 2deg)) translateX(-1px); }
      90%  { transform: rotate(calc(var(--base-rot) - 1deg)) translateX(1px); }
      100% { transform: rotate(var(--base-rot)) translateX(0); }
    }
    @keyframes btn-pop {
      0%   { transform: rotate(var(--base-rot)) scale(1); opacity:1; }
      20%  { transform: rotate(var(--base-rot)) scale(1.18); opacity:1; }
      45%  { transform: rotate(var(--base-rot)) scale(0.05); opacity:0.6; }
      100% { transform: rotate(var(--base-rot)) scale(0); opacity:0; }
    }

    .contact-btn.wiggling {
      animation: btn-wiggle 0.55s cubic-bezier(0.36,0.07,0.19,0.97) forwards;
    }
    .contact-btn.popping {
      animation: btn-pop 0.38s cubic-bezier(0.55,0.06,0.68,0.19) forwards;
      pointer-events: none;
    }

    #btn-email    { --base-rot: -9.49deg; }
    #btn-linkedin { --base-rot: 8.6deg;   }
    #btn-instagram{ --base-rot: 24.07deg; }
    #btn-coffee   { --base-rot: -14.2deg; }

    /* Copy toast */
    #copy-toast {
      position:fixed; bottom:80px; left:50%;
      transform:translateX(-50%) translateY(20px);
      background:rgba(0,0,0,0.75); color:#fff;
      padding:10px 22px; border-radius:8px;
      font-size:13px; font-weight:400; letter-spacing:-0.2px;
      opacity:0; pointer-events:none;
      transition:opacity 0.25s, transform 0.25s;
      z-index:9000;
    }
    #copy-toast.show {
      opacity:1; transform:translateX(-50%) translateY(0);
    }
    @media (prefers-reduced-motion: reduce) {
      #home-btn:hover #home-btn-shape { animation:none; }
      #home-btn.popping #home-btn-shape { animation:none; }
      .nav-triangle.pop { animation:none; }
    }
    #home-btn:focus-visible, #menu-btn:focus-visible, #dark-toggle:focus-visible {
      outline:2px solid #fff; outline-offset:3px; border-radius:4px;
    }
    #search-btn {
      position:fixed; top:36px; right:104px; z-index:9700;
      width:32px; height:32px; border-radius:50%;
      background:rgba(255,255,255,0.15); cursor:none;
      display:flex; align-items:center; justify-content:center;
      transition:background 0.2s ease; color:#fff;
    }
    #search-btn:hover { background:rgba(255,255,255,0.25); }
    #search-btn:focus-visible { outline:2px solid #fff; outline-offset:3px; }
    #search-close-icon { display:none; }
    #search-overlay {
      position:fixed; inset:0; z-index:9800;
      background:rgba(0,0,0,0.72);
      display:flex; align-items:flex-start; justify-content:center;
      padding-top:14vh;
      opacity:0; visibility:hidden; pointer-events:none;
      transition:opacity 0.25s ease, visibility 0s linear 0.25s;
    }
    #search-overlay.show {
      opacity:1; visibility:visible; pointer-events:all;
      transition:opacity 0.25s ease, visibility 0s linear 0s;
    }
    #search-box { width:min(640px, 88vw); }
    #search-input {
      width:100%; background:transparent; border:none; border-bottom:2px solid rgba(255,255,255,0.4);
      color:#fff; font-size:30px; font-weight:500; letter-spacing:-1px;
      padding:12px 4px; outline:none; font-family:inherit; cursor:text;
    }
    #search-input::placeholder { color:rgba(255,255,255,0.35); }
    #search-results { margin-top:20px; max-height:52vh; overflow-y:auto; }
    .search-result {
      padding:16px 4px; border-bottom:1px solid rgba(255,255,255,0.14);
      cursor:none; display:block; text-decoration:none; color:#fff;
      border-left:3px solid transparent; padding-left:12px;
      transition:background 0.12s ease, border-color 0.12s ease;
    }
    .search-result:hover, .search-result.active {
      background:rgba(255,255,255,0.08); border-left-color:rgba(255,255,255,0.7);
    }
    .search-result-title { font-size:18px; font-weight:600; letter-spacing:-0.3px; }
    .search-result-type { font-size:11px; text-transform:uppercase; letter-spacing:0.06em; opacity:0.5; margin-left:8px; font-weight:400; }
    .search-result-snippet { font-size:14px; opacity:0.65; line-height:1.4; margin-top:4px; }
    .search-result mark { background:rgba(255,255,255,0.35); color:inherit; border-radius:2px; padding:0 2px; }
    #search-empty { color:rgba(255,255,255,0.5); font-size:15px; margin-top:20px; display:none; }
    @media (prefers-reduced-motion: reduce) {
      #search-overlay { transition:opacity 0.05s linear, visibility 0s linear 0.05s; }
      #search-overlay.show { transition:opacity 0.05s linear, visibility 0s linear 0s; }
      .search-result { transition:none; }
    }
    @media (max-width:600px) {
      #search-btn { right:88px; }
      #search-input { font-size:22px; }
    }
    #no-inspect-toast {
      position:fixed; z-index:99999;
      background:#1e1e1e; color:#fff;
      padding:14px 22px; border-radius:99px;
      font-size:15px; font-weight:500; letter-spacing:-0.2px;
      box-shadow:0 8px 30px rgba(0,0,0,0.3);
      opacity:0; transform:translateY(8px) scale(0.96);
      transition:opacity 0.22s ease, transform 0.22s ease;
      pointer-events:none; white-space:nowrap;
      font-family:'Inter',sans-serif;
    }
    #no-inspect-toast.show { opacity:1; transform:translateY(0) scale(1); }
    @media (prefers-reduced-motion: reduce) {
      #no-inspect-toast { transition:opacity 0.05s linear; transform:none !important; }
    }
  </style>
</head>

<script>
  // ── Theme ──
  if (localStorage.getItem('darkModeV2') !== '0') document.body.classList.add('dark'); // dark is the default
function addKeyboardActivation(el) {
  if (!el) return;
  el.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      el.click();
    }
  });
}
['dark-toggle', 'home-btn', 'menu-btn'].forEach(function(id) { addKeyboardActivation(document.getElementById(id)); });

  document.getElementById('dark-toggle').addEventListener('click', function(e) {
    e.stopPropagation();
    document.body.classList.toggle('dark');
    localStorage.setItem('darkModeV2', document.body.classList.contains('dark') ? '1' : '0');
  });

  // ── Cursor ──
  var cursor = document.getElementById('cursor');
  var homeBtn = document.getElementById('home-btn');
  homeBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    homeBtn.classList.add('popping');
    setTimeout(function() { window.location.href = 'portfolio.html'; }, 380);
  });
  var mouseX = -200, mouseY = -200;
  document.addEventListener('mousemove', function(e) {
    mouseX = e.clientX; mouseY = e.clientY;
    cursor.style.left = mouseX + 'px';
    cursor.style.top  = mouseY + 'px';
    wiggleSquiggle(mouseX, mouseY);
  });
  window.addEventListener('scroll', function() {
    cursor.style.left = mouseX + 'px';
    cursor.style.top  = mouseY + 'px';
  }, { passive: true, capture: true });
  document.addEventListener('mousedown', function() {
    cursor.classList.remove('recovering'); cursor.classList.add('clicked');
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      cursor.classList.remove('clicked'); cursor.classList.add('recovering');
    }); });
  });

  // ── Page in ──
  var tOverlay = document.getElementById('t-overlay');
  window.addEventListener('load', function() {
    requestAnimationFrame(function() {
      tOverlay.classList.add('clear');
      setTimeout(function() {
        document.getElementById('contact-label').style.opacity = '1';
        startTypewriter();
      }, 300);
    });
  });

  // ── Squiggly line ──
  var W = 1440, H = 120, CY = 60;
  var SEGS = 14; // number of wave segments
  var baseAmps = []; // base amplitudes for each control point
  var wiggleAmps = []; // extra amplitude from cursor
  var NUM_POINTS = SEGS * 2 + 2;

  // Base wave: gentle sine
  for (var i = 0; i < NUM_POINTS; i++) {
    baseAmps.push(((i % 3 === 1) ? 18 : -18) * (0.5 + 0.5 * Math.random()));
    wiggleAmps.push(0);
  }

  function buildPath(amps) {
    var pts = [];
    for (var i = 0; i < NUM_POINTS; i++) {
      var x = (i / (NUM_POINTS - 1)) * W;
      var y = CY + amps[i];
      pts.push([x, y]);
    }
    // Build smooth cubic bezier through all points
    var d = 'M ' + pts[0][0] + ' ' + pts[0][1];
    for (var i = 0; i < pts.length - 1; i++) {
      var x0 = pts[i][0], y0 = pts[i][1];
      var x1 = pts[i+1][0], y1 = pts[i+1][1];
      var dx = (x1 - x0) / 3;
      d += ' C ' + (x0+dx) + ' ' + y0 + ', ' + (x1-dx) + ' ' + y1 + ', ' + x1 + ' ' + y1;
    }
    return d;
  }

  var squigglePath = document.getElementById('squiggle-path');
  // Init base path
  squigglePath.setAttribute('d', buildPath(baseAmps));

  // Animate base wave gently
  var phase = 0;
  function animateSquiggle() {
    phase += 0.012;
    var combined = [];
    for (var i = 0; i < NUM_POINTS; i++) {
      var base = 20 * Math.sin(phase + i * 0.7);
      combined.push(base + wiggleAmps[i]);
    }
    squigglePath.setAttribute('d', buildPath(combined));
    requestAnimationFrame(animateSquiggle);
  }
  animateSquiggle();

  // Wiggle on cursor proximity
  function wiggleSquiggle(mx, my) {
    // Convert screen X to SVG X (squiggle-wrap is positioned at 50% top)
    var wrap = document.getElementById('squiggle-wrap');
    var rect = wrap.getBoundingClientRect();
    var svgX = ((mx - rect.left) / rect.width) * W;
    var svgY = my - rect.top;
    var INFLUENCE = 180; // px radius of influence
    for (var i = 0; i < NUM_POINTS; i++) {
      var px = (i / (NUM_POINTS - 1)) * W;
      var dist = Math.abs(px - svgX);
      if (dist < INFLUENCE) {
        var strength = (1 - dist / INFLUENCE);
        var push = (svgY - CY) * strength * 0.6;
        wiggleAmps[i] = push;
      } else {
        wiggleAmps[i] *= 0.9; // decay
      }
    }
  }

  // ── Typewriter ──
  function pause(ms) { return new Promise(function(r){ setTimeout(r,ms); }); }

  var twText = document.getElementById('tw-text');
  var twCursor = document.getElementById('tw-cursor');

  async function typeChars(text, ms) {
    for (var i = 0; i < text.length; i++) {
      twText.textContent += text[i];
      await pause(ms);
    }
  }
  async function eraseChars(n, ms) {
    for (var i = 0; i < n; i++) {
      twText.textContent = twText.textContent.slice(0,-1);
      await pause(ms);
    }
  }

  async function startTypewriter() {
    dropButtons();
    while (true) {
      await pause(200);
      // Phrase 1
      await typeChars("would you like some pesto?", 72);
      await pause(900);
      await eraseChars(twText.textContent.length, 38);
      await pause(350);
      // Phrase 2
      await typeChars("oh, would you like to work together?", 68);
      await pause(900);
      await eraseChars(twText.textContent.length, 38);
      await pause(350);
      // Final - lingers longer before looping back
      await typeChars("what's your story? :)", 76);
      await pause(2600);
      await eraseChars(twText.textContent.length, 38);
      await pause(350);
    }
  }

  // ── Button drop animation ──
  var buttons = document.querySelectorAll('.contact-btn');
  var baseRots = { 'btn-email': -9.49, 'btn-linkedin': 8.6, 'btn-instagram': 24.07, 'btn-coffee': -14.2 };

  function dropButtons() {
    var delays = [0, 180, 360];
    buttons.forEach(function(btn, i) {
      setTimeout(function() {
        var rot = baseRots[btn.id] || 0;
        btn.style.transition = 'opacity 0.08s, transform 0.58s cubic-bezier(0.34,1.4,0.64,1)';
        btn.style.opacity = '1';
        btn.style.transform = 'rotate(' + rot + 'deg) translateY(0)';
        btn.classList.add('landed');
      }, delays[i]);
    });
  }

  // ── Wiggle on hover, pop on click ──
  buttons.forEach(function(btn) {
    var rot = baseRots[btn.id] || 0;
    var wiggleTimeout = null;

    btn.addEventListener('mouseenter', function() {
      if (btn.classList.contains('popping')) return;
      btn.classList.remove('wiggling');
      void btn.offsetWidth; // reflow to restart animation
      btn.classList.add('wiggling');
      clearTimeout(wiggleTimeout);
      wiggleTimeout = setTimeout(function() { btn.classList.remove('wiggling'); }, 600);
    });

    btn.addEventListener('animationend', function(e) {
      if (e.animationName === 'btn-wiggle') {
        btn.classList.remove('wiggling');
        btn.style.transform = 'rotate(' + rot + 'deg) translateY(0)';
      }
    });
  });

  // ── Button actions ──
  function popThen(btn, action) {
    btn.classList.remove('wiggling');
    btn.classList.add('popping');
    setTimeout(function() {
      btn.classList.remove('popping');
      btn.style.opacity = '1';
      btn.style.transform = 'rotate(' + (baseRots[btn.id] || 0) + 'deg) translateY(0)';
      action();
    }, 400);
  }

  var emailBtn    = document.getElementById('btn-email');
  var linkedinBtn = document.getElementById('btn-linkedin');
  var instagramBtn= document.getElementById('btn-instagram');
  var coffeeBtn    = document.getElementById('btn-coffee');
  var copyToast   = document.getElementById('copy-toast');

  emailBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    popThen(emailBtn, function() {
      navigator.clipboard.writeText('jkarthik@sva.edu').then(function() {
        copyToast.classList.add('show');
        setTimeout(function() { copyToast.classList.remove('show'); }, 2200);
      }).catch(function() {
        var ta = document.createElement('textarea');
        ta.value = 'jkarthik@sva.edu'; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        copyToast.classList.add('show');
        setTimeout(function() { copyToast.classList.remove('show'); }, 2200);
      });
    });
  });

  linkedinBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    popThen(linkedinBtn, function() {
      window.open('https://www.linkedin.com/in/janani-karthik/', '_blank');
    });
  });

  instagramBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    popThen(instagramBtn, function() {
      window.open('https://www.instagram.com/janoooni/?hl=en', '_blank');
    });
  });

  coffeeBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    popThen(coffeeBtn, function() {
      window.open('https://calendar.app.google/yDZhsRrnnau8c3WK7', '_blank');
    });
  });

  // ── Hamburger ──
  (function() {
    var mb = document.getElementById('menu-btn');
    var nd = document.getElementById('nav-dropdown');
    var nw = document.getElementById('nav-work');
    var ws = document.getElementById('work-subpages');
    function setWorkSubpagesOpen(isOpen) {
      ws.style.maxHeight = isOpen ? (ws.scrollHeight + 'px') : '0px';
      ws.classList.toggle('open', isOpen);
      navWorkLabel.textContent = isOpen ? '- work' : '+ work';
    }
    var expanded = false, menuOpen = false;
    mb.addEventListener('click', function(e) {
      e.stopPropagation();
      menuOpen = !menuOpen;
      mb.classList.toggle('open', menuOpen);
      nd.classList.toggle('open', menuOpen);
      if (!menuOpen) { expanded = false; setWorkSubpagesOpen(false); }
    });
    var navWorkLabel = document.getElementById('nav-work-label');
    nw.addEventListener('click', function(e) {
      e.stopPropagation();
      expanded = !expanded;
      setWorkSubpagesOpen(expanded);
    });
    nw.addEventListener('dblclick', function(e) {
      e.stopPropagation();
      window.location.href = 'portfolio.html';
    });
    nd.addEventListener('click', function(e) { e.stopPropagation(); });
    document.addEventListener('click', function() {
      menuOpen = false; expanded = false;
      mb.classList.remove('open'); nd.classList.remove('open'); setWorkSubpagesOpen(false);
    });
  })();
var SEARCH_BASE_PATH = '';
(function() {
  var searchBtn = document.getElementById('search-btn');
  var searchIcon = document.getElementById('search-icon');
  var searchCloseIcon = document.getElementById('search-close-icon');
  var searchOverlay = document.getElementById('search-overlay');
  var searchInput = document.getElementById('search-input');
  var searchResultsEl = document.getElementById('search-results');
  var searchEmptyEl = document.getElementById('search-empty');
  if (!searchBtn || typeof buildSearchIndex !== 'function') return;
  var searchIndex = buildSearchIndex();
  var basePath = typeof SEARCH_BASE_PATH === 'string' ? SEARCH_BASE_PATH : '';
  var searchOpen = false;
  var activeResultIndex = -1;
  var currentResultEls = [];

  function openSearch() {
    searchOpen = true;
    searchOverlay.classList.add('show');
    searchIcon.style.display = 'none';
    searchCloseIcon.style.display = '';
    searchBtn.setAttribute('aria-label', 'Close search');
    searchInput.value = '';
    searchResultsEl.innerHTML = '';
    searchEmptyEl.style.display = 'none';
    activeResultIndex = -1;
    currentResultEls = [];
    setTimeout(function() { searchInput.focus(); }, 60);
  }

  function closeSearch() {
    searchOpen = false;
    searchOverlay.classList.remove('show');
    searchIcon.style.display = '';
    searchCloseIcon.style.display = 'none';
    searchBtn.setAttribute('aria-label', 'Search');
    searchBtn.focus();
  }

  searchBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (searchOpen) closeSearch(); else openSearch();
  });
  searchBtn.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      if (searchOpen) closeSearch(); else openSearch();
    }
  });
  searchOverlay.addEventListener('click', function(e) {
    if (e.target === searchOverlay) closeSearch();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && searchOpen) closeSearch();
  });

  function setActiveResult(index) {
    currentResultEls.forEach(function(el) { el.classList.remove('active'); });
    activeResultIndex = index;
    if (index >= 0 && index < currentResultEls.length) {
      var el = currentResultEls[index];
      el.classList.add('active');
      el.scrollIntoView({ block: 'nearest' });
    }
  }

  function renderResults(query) {
    var results = runSearch(searchIndex, query);
    searchResultsEl.innerHTML = '';
    currentResultEls = [];
    activeResultIndex = -1;
    if (!query.trim()) { searchEmptyEl.style.display = 'none'; return; }
    if (!results.length) { searchEmptyEl.style.display = 'block'; return; }
    searchEmptyEl.style.display = 'none';
    results.forEach(function(r) {
      var a = document.createElement('a');
      a.className = 'search-result';
      a.href = basePath + r.url;
      a.style.cursor = 'none';
      var titleRow = document.createElement('div');
      titleRow.className = 'search-result-title';
      titleRow.innerHTML = highlightMatch(r.title, query);
      var typeSpan = document.createElement('span');
      typeSpan.className = 'search-result-type';
      typeSpan.textContent = r.type;
      titleRow.appendChild(typeSpan);
      a.appendChild(titleRow);
      if (r.snippet) {
        var snip = document.createElement('div');
        snip.className = 'search-result-snippet';
        snip.innerHTML = highlightMatch(r.snippet, query);
        a.appendChild(snip);
      }
      searchResultsEl.appendChild(a);
      currentResultEls.push(a);
    });
  }

  searchInput.addEventListener('input', function() { renderResults(searchInput.value); });

  // Arrow-key navigation through results, Enter to follow the active (or
  // sole) result - keeps search fully usable without a mouse.
  searchInput.addEventListener('keydown', function(e) {
    if (!currentResultEls.length) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      setActiveResult(activeResultIndex < currentResultEls.length - 1 ? activeResultIndex + 1 : 0);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      setActiveResult(activeResultIndex > 0 ? activeResultIndex - 1 : currentResultEls.length - 1);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      var target = activeResultIndex >= 0 ? currentResultEls[activeResultIndex] : currentResultEls[0];
      if (target) target.click();
    }
  });
})();

(function() {
  var toast = document.createElement('div');
  toast.id = 'no-inspect-toast';
  toast.textContent = "oop, you don't have to go there!";
  document.body.appendChild(toast);
  var hideTimer = null;

  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    var toastWidth = 280;
    var x = Math.min(Math.max(e.clientX, 12), window.innerWidth - toastWidth - 12);
    var y = Math.max(e.clientY - 56, 12);
    toast.style.left = x + 'px';
    toast.style.top = y + 'px';
    toast.classList.add('show');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function() { toast.classList.remove('show'); }, 1800);
  });
})();
