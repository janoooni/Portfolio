<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Janani - Visual Systems Design</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; }
    :root { --bg:#ff7d3c; --fg:#fff; }
    body.dark { --bg:#1e1e1e; }
    body { background:var(--bg); font-family:'Inter',sans-serif; cursor:none; min-height:100vh; overflow-y:auto; transition:background 0.4s; }

    #cursor { position:fixed; left:-100px; top:-100px; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.5); pointer-events:none; transform:translate(-50%,-50%); z-index:9999; }
    #cursor.clicked { opacity:0; transition:opacity 0s; }
    #cursor.recovering { opacity:1; transition:opacity 0.15s ease; }
    #home-btn {
      position:fixed; top:16px; left:16px; z-index:8600;
      width:32px; height:32px; border-radius:50%;
      background:rgba(255,255,255,0.15); cursor:none;
      display:flex; align-items:center; justify-content:center;
      transition:background 0.2s ease;
    }
    #home-btn:hover { background:rgba(255,255,255,0.25); }
    #home-btn-shape {
      display:inline-block; width:0; height:0;
      border-left:6px solid transparent; border-right:6px solid transparent;
      border-bottom:10px solid var(--fg);
    }
    #home-btn:hover #home-btn-shape { animation:home-btn-spin 0.7s linear infinite; }
    @keyframes home-btn-spin {
      from { transform:rotate(0deg); }
      to   { transform:rotate(360deg); }
    }
    @keyframes home-btn-pop {
      0%   { transform:scale(1) rotate(0deg); opacity:1; }
      20%  { transform:scale(1.35) rotate(0deg); opacity:1; }
      45%  { transform:scale(0.05) rotate(0deg); opacity:0.7; }
      100% { transform:scale(0) rotate(0deg); opacity:0; }
    }
    #home-btn.popping #home-btn-shape { animation:home-btn-pop 0.38s cubic-bezier(0.55,0.06,0.68,0.19) forwards; }

    #menu-btn { position:fixed; top:36px; right:44px; z-index:8600; cursor:none; display:flex; flex-direction:column; gap:6px; padding:8px; }
    #menu-btn span { display:block; width:28px; height:2.5px; background:var(--fg,#fff); border-radius:99px; transition:transform 0.3s,opacity 0.3s; transform-origin:center; }
    #menu-btn.open span:nth-child(1) { transform:translateY(8.5px) rotate(45deg); }
    #menu-btn.open span:nth-child(2) { opacity:0; transform:scaleX(0); }
    #menu-btn.open span:nth-child(3) { transform:translateY(-8.5px) rotate(-45deg); }
    #nav-dropdown { position:fixed; top:92px; right:44px; z-index:8700; display:flex; flex-direction:column; align-items:flex-end; pointer-events:none; opacity:0; transform:translateY(-8px); transition:opacity 0.25s,transform 0.25s; }
    #nav-dropdown.open { opacity:1; transform:translateY(0); pointer-events:all; }
    .nav-item { font-weight:500; font-size:28px; color:var(--fg,#fff); letter-spacing:-1.4px; text-transform:lowercase; line-height:1.25; cursor:none; text-decoration:none; opacity:0.9; transition:opacity 0.15s; }
    .nav-item:hover, .nav-item.current { opacity:1; }
    #work-subpages { display:flex; flex-direction:column; align-items:flex-end; overflow:hidden; max-height:0; opacity:0; transition:max-height 0.35s ease,opacity 0.3s ease; }
    #work-subpages.open { max-height:220px; opacity:1; }
    #about-subpages { display:flex; flex-direction:column; align-items:flex-end; overflow:hidden; max-height:0; opacity:0; transition:max-height 0.35s ease,opacity 0.3s ease; }
    #about-subpages.open { opacity:1; }
    .sub-item { font-weight:500; font-size:19px; color:var(--fg,#fff); letter-spacing:-0.9px; text-transform:lowercase; line-height:1.35; cursor:none; text-decoration:none; opacity:0.6; transition:opacity 0.15s; }
    .sub-item:hover, .sub-item.current { opacity:1; }
    .nav-triangle {
      display:inline-block; width:0; height:0;
      border-left:6px solid transparent; border-right:6px solid transparent;
      border-bottom:9px solid var(--fg);
      flex-shrink:0;
    }
    @keyframes nav-triangle-pop {
      0%   { transform:scale(1); }
      40%  { transform:scale(1.7); }
      70%  { transform:scale(0.82); }
      100% { transform:scale(1); }
    }
    .nav-triangle.pop { animation:nav-triangle-pop 0.4s cubic-bezier(0.34,1.56,0.64,1); }


    #dark-toggle {
      position:fixed; bottom:36px; right:44px; z-index:8600; cursor:none;
      width:36px; height:20px; background:rgba(255,255,255,0.25); border-radius:99px;
      transition:background 0.3s;
    }
    #dark-toggle::after {
      content:''; position:absolute; width:14px; height:14px;
      border-radius:50%; background:#fff; top:3px; left:3px; transition:transform 0.3s;
    }
    body.dark #dark-toggle { background:rgba(255,125,60,0.5); }
    body.dark #dark-toggle::after { transform:translateX(16px); }

    #site-copyright {
      position:fixed; bottom:36px; left:54px; z-index:30;
      font-size:11px; font-weight:400; color:rgba(255,255,255,0.3);
      letter-spacing:-0.1px; pointer-events:none;
    }
    body.dark #site-copyright { color:rgba(255,255,255,0.2); }

    #page {
      padding: 120px 54px 100px;
      opacity:0; transition:opacity 0.5s ease;
    }
    #page.visible { opacity:1; }

    #work-corner-label {
      position:absolute; left:54px; top:44px; z-index:50;
      font-weight:600; font-size:32px; letter-spacing:-1.6px;
      color:rgba(255,255,255,0.45); text-transform:lowercase; pointer-events:none;
    }
    body.dark #work-corner-label { color:rgba(255,255,255,0.3); }

    h1.page-heading {
      font-size:48px; font-weight:500; color:var(--fg);
      letter-spacing:-2.5px; text-transform:lowercase;
      margin-bottom:12px; line-height:1;
    }
    .page-subtitle {
      font-size:14px; color:rgba(255,255,255,0.5); letter-spacing:-0.3px;
      margin-bottom:56px;
    }

    #proj-grid {
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap:20px;
    }
    .proj-card {
      background:rgba(255,255,255,0.12);
      border-radius:10px; overflow:hidden; cursor:none;
      transition:opacity 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18), 0 2px 5px rgba(0,0,0,0.1);
    }
    .proj-card:hover {
      opacity:0.88;
      box-shadow: 0 10px 30px rgba(0,0,0,0.26), 0 3px 8px rgba(0,0,0,0.14);
    }
    .proj-card:focus-visible { outline:2px solid #fff; outline-offset:3px; }
    .card-thumb {
      width:100%; aspect-ratio:16/10; overflow:hidden; background:#ffd7d7;
      display:flex; align-items:center; justify-content:center;
    }
    .card-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .card-placeholder {
      font-size:11px; color:rgba(0,0,0,0.3); font-weight:500; letter-spacing:-0.2px;
      padding:16px; text-align:center; line-height:1.4; text-transform:uppercase;
    }
    .card-name {
      padding:14px 16px 16px;
      font-size:13px; font-weight:500; color:var(--fg);
      letter-spacing:-0.3px; line-height:1.3;
    }

    /* ── PROJECT DETAIL OVERLAY (rich template, identical to portfolio.html) ── */
    #project-overlay { position:fixed; inset:0; z-index:6600; opacity:0; pointer-events:none; transition:opacity 0.4s; }
    #project-overlay.show { opacity:1; pointer-events:all; }

    #pd-back {
      position:fixed; top:64px; left:16px; z-index:6700;
      font-size:14px; font-weight:500; color:var(--fg);
      letter-spacing:-0.3px; cursor:none; opacity:0.75; transition:opacity 0.2s;
    }
    #pd-back:hover { opacity:1; }

    #pd-expanded {
      position:absolute; inset:0; background:var(--bg);
      overflow-y:auto; padding:0 0 120px;
      opacity:1; visibility:visible;
      transition:opacity 0.35s ease, visibility 0s linear 0s;
    }
    #pd-expanded.hidden {
      opacity:0; visibility:hidden; pointer-events:none;
      transition:opacity 0.35s ease, visibility 0s linear 0.35s;
    }
    #pd-exp-inner { max-width:1455px; margin:0 auto; padding:0 87px; }

    #pd-title-row {
      display:flex; align-items:flex-end; justify-content:space-between;
      gap:24px; padding-top:241px; margin-bottom:60px;
    }
    #pd-title, #pd-col-title {
      font-weight:600; font-size:64px; color:var(--fg);
      letter-spacing:-3.2px; line-height:1.05; margin:0;
    }
    #pd-toggle-btn {
      flex-shrink:0; z-index:10;
      font-size:14px; font-weight:500; letter-spacing:-0.3px;
      color:var(--fg); opacity:0.95; cursor:none;
      padding:10px 18px; border:1.5px solid rgba(0,0,0,0.18); border-radius:99px;
      transition:opacity 0.2s, background 0.2s;
      background:#c0501f;
      white-space:nowrap; margin-bottom:10px;
    }
    #pd-toggle-btn:hover { opacity:1; background:#a8430f; }
    #pd-toggle-btn.active { opacity:1; background:#963b0c; }
    body.dark #pd-toggle-btn { background:#d96b3a; }
    body.dark #pd-toggle-btn:hover { background:#c25a2b; }
    body.dark #pd-toggle-btn.active { background:#a8481f; }

    #pd-meta-grid, #pd-col-meta-grid {
      display:grid; grid-template-columns:repeat(5,1fr); gap:24px;
      margin-bottom:56px; padding-bottom:40px;
      border-bottom:1px solid rgba(255,255,255,0.18);
    }
    .pd-meta-label, .pd-col-meta-label {
      font-size:13px; font-weight:600; color:rgba(255,255,255,0.5);
      letter-spacing:0.04em; text-transform:uppercase; margin-bottom:8px;
    }
    .pd-meta-value, .pd-col-meta-value {
      font-size:15px; font-weight:400; color:var(--fg); line-height:1.5; white-space:pre-line;
    }

    .pd-quote, #pd-col-quote {
      font-weight:500; font-size:24px; color:var(--fg);
      letter-spacing:-1px; line-height:1.4; margin:0 0 56px; max-width:900px;
    }

    .pd-exp-img-wrap {
      width:100%; aspect-ratio:16/10; border-radius:10px; overflow:hidden;
      background:#ffd7d7; margin-bottom:14px;
      display:flex; align-items:center; justify-content:center;
    }
    .pd-exp-img-wrap img, .pd-exp-img-wrap video { width:100%; height:100%; object-fit:cover; display:block; }
    .pd-exp-img-wrap.empty { color:rgba(0,0,0,0.25); font-size:13px; letter-spacing:0.04em; text-transform:uppercase; }
    body.dark .pd-exp-img-wrap.empty { background:#3a3a3a; color:rgba(255,255,255,0.25); }
    .pd-img-caption { font-size:15px; color:var(--fg); opacity:0.7; margin:0 0 64px; font-style:italic; }
    .pd-media-caption { font-size:12px; font-weight:300; color:var(--fg); opacity:0.6; margin-top:6px; margin-bottom:8px; font-style:italic; line-height:1.4; }
    .pd-media-link { position:relative; display:block; width:100%; height:100%; cursor:none; transition:filter 0.2s ease; }
    .pd-media-link:hover { filter:brightness(0.92); }
    .pd-media-link-badge {
      position:absolute; top:10px; right:10px; z-index:2;
      width:28px; height:28px; border-radius:50%;
      background:rgba(0,0,0,0.5);
      display:flex; align-items:center; justify-content:center;
      color:#fff; font-size:14px; line-height:1; font-weight:500;
      opacity:0.8; transition:opacity 0.2s ease, transform 0.2s ease;
      pointer-events:none;
    }
    .pd-media-link:hover .pd-media-link-badge { opacity:1; transform:scale(1.12); }

    #pd-exp-rest-images {
      margin-bottom:80px;
    }
    #pd-exp-rest-images:empty { margin-bottom:0; }
    .pd-rest-img-wrap {
      width:100%; aspect-ratio:16/10; border-radius:10px; overflow:hidden;
      background:#ffd7d7; margin-bottom:14px;
      display:flex; align-items:center; justify-content:center;
    }
    .pd-rest-img-wrap img, .pd-rest-img-wrap video { width:100%; height:100%; object-fit:cover; display:block; }
    .pd-rest-img-wrap.empty { color:rgba(0,0,0,0.25); font-size:12px; letter-spacing:0.04em; text-transform:uppercase; }
    body.dark .pd-rest-img-wrap.empty { background:#3a3a3a; color:rgba(255,255,255,0.25); }

    .pd-section { margin-bottom:64px; max-width:1029px; }
    .pd-section-label {
      font-weight:600; font-size:13px; color:var(--fg);
      letter-spacing:0.1em; text-transform:uppercase; opacity:0.55; margin-bottom:18px;
    }
    .pd-section-lede { font-weight:500; font-size:22px; color:var(--fg); letter-spacing:-0.5px; line-height:1.4; margin-bottom:20px; }
    .pd-section-body { font-size:16px; color:rgba(255,255,255,0.85); line-height:1.7; margin-bottom:18px; }
    .pd-inline-link { color:inherit; text-decoration:underline; text-underline-offset:2px; }
    .pd-inline-link:hover { opacity:0.8; }
    .pd-pull-quote {
      font-style:italic; font-size:18px; color:rgba(255,255,255,0.7);
      border-left:2px solid rgba(255,255,255,0.3); padding-left:20px; margin:24px 0;
    }
    .pd-prompt { font-size:17px; color:var(--fg); font-style:italic; opacity:0.9; line-height:1.6; margin-top:8px; }
    .pd-blog-link { font-size:14px; color:rgba(255,255,255,0.5); margin-top:24px; }

    #pd-collapsed {
      position:absolute; inset:0; display:flex;
      opacity:0; visibility:hidden; pointer-events:none;
      transition:opacity 0.35s ease, visibility 0s linear 0.35s;
    }
    #pd-collapsed.active {
      opacity:1; visibility:visible; pointer-events:all;
      transition:opacity 0.35s ease, visibility 0s linear 0s;
    }
    #pd-col-left { width:62%; height:100%; overflow-y:auto; background:var(--bg); padding:0 0 120px; }
    #pd-col-left-inner { max-width:1000px; padding:0 80px; }
    #pd-col-title { padding-top:241px; margin-bottom:48px; }
    #pd-col-meta-grid { grid-template-columns:repeat(3,1fr); }
    .pd-col-img-wrap {
      width:100%; aspect-ratio:16/10; border-radius:10px; overflow:hidden;
      background:#ffd7d7; margin-bottom:14px;
      display:flex; align-items:center; justify-content:center;
    }
    .pd-col-img-wrap img, .pd-col-img-wrap video { width:100%; height:100%; object-fit:cover; display:block; }
    .pd-col-img-wrap.empty { color:rgba(0,0,0,0.25); font-size:13px; letter-spacing:0.04em; text-transform:uppercase; }
    body.dark .pd-col-img-wrap.empty { background:#3a3a3a; color:rgba(255,255,255,0.25); }

    #pd-col-right {
      width:38%; height:100%; overflow-y:auto;
      background:#f1631c; transition:background 0.4s;
      padding:0 0 120px; position:relative;
    }
    body.dark #pd-col-right { background:#2a2a2a; }
    #pd-col-right-inner { padding:241px 60px 0 30px; max-width:599px; }

    #pd-close-text {
      position:absolute; top:241px; right:60px; transform:translateY(-100%);
      width:36px; height:36px; border-radius:50%;
      background:rgba(255,255,255,0.15); cursor:none;
      display:flex; align-items:center; justify-content:center;
      font-size:18px; color:#fff; opacity:0.8; transition:opacity 0.2s, background 0.2s;
      z-index:10;
    }
    #pd-close-text:hover { opacity:1; background:rgba(255,255,255,0.25); }

    #pd-col-right .pd-section { max-width:none; margin-bottom:48px; }
    #pd-col-right .pd-section-lede { font-size:18px; }
    #pd-col-right .pd-section-body { font-size:15px; }

    #t-overlay {
      position:fixed; inset:0; background:var(--bg);
      opacity:1; pointer-events:none; z-index:8000; transition:opacity 0.5s;
    }
    #t-overlay.clear { opacity:0; }

    @media (max-width: 1000px) {
      #pd-title, #pd-col-title { font-size:40px; letter-spacing:-2px; }
      #pd-title-row { padding-top:160px; margin-bottom:48px; flex-direction:column; align-items:flex-start; gap:16px; }
      #pd-toggle-btn { font-size:12px; padding:8px 14px; margin-bottom:0; }
      #pd-col-title { padding-top:160px; }
      #pd-close-text { top:160px; right:24px; }
      .pd-exp-img-wrap, .pd-col-img-wrap, .pd-rest-img-wrap { height:auto; aspect-ratio:16/10; }
      #pd-collapsed { flex-direction:column; height:auto; overflow-y:auto; }
      #pd-col-left, #pd-col-right { width:100%; height:auto; overflow-y:visible; }
      #pd-col-right-inner { padding:80px 24px 0; }
      #pd-back { left:16px; top:56px; }
      #pd-exp-inner, #pd-col-left-inner { padding:0 24px; }
      .pd-meta-label, .pd-col-meta-label { font-size:11px; }
      .pd-quote, #pd-col-quote { font-size:20px; }
      #pd-meta-grid, #pd-col-meta-grid { grid-template-columns:repeat(2,1fr); }
      #proj-grid { gap:14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      #home-btn:hover #home-btn-shape { animation:none; }
      #home-btn.popping #home-btn-shape { animation:none; }
      .nav-triangle.pop { animation:none; }
    }
    #home-btn:focus-visible, #menu-btn:focus-visible, #dark-toggle:focus-visible {
      outline:2px solid #fff; outline-offset:3px; border-radius:4px;
    }
  </style>
<script src="projects-data.js"></script>
</head>

<script>


  // Theme
  var savedDark = localStorage.getItem('dark') === '1';
  if (savedDark) document.body.classList.add('dark');
  var darkToggle = document.getElementById('dark-toggle');
function addKeyboardActivation(el) {
  if (!el) return;
  el.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      el.click();
    }
  });
}
['dark-toggle', 'home-btn', 'menu-btn'].forEach(function(id) { addKeyboardActivation(document.getElementById(id)); });

  darkToggle.addEventListener('click', function(e) {
    e.stopPropagation();
    document.body.classList.toggle('dark');
    localStorage.setItem('dark', document.body.classList.contains('dark') ? '1' : '0');
  });

  // Cursor
  var cursor = document.getElementById('cursor');
  var homeBtn = document.getElementById('home-btn');
  homeBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    homeBtn.classList.add('popping');
    setTimeout(function() { window.location.href = 'portfolio.html'; }, 380);
  });
  document.addEventListener('mousemove', function(e) {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
  });
  document.addEventListener('mousedown', function() {
    cursor.classList.remove('recovering');
    cursor.classList.add('clicked');
    requestAnimationFrame(function() { requestAnimationFrame(function() {
      cursor.classList.remove('clicked');
      cursor.classList.add('recovering');
    }); });
  });

  // Page fade-in
  var tOverlay = document.getElementById('t-overlay');
  var page = document.getElementById('page');
  window.addEventListener('load', function() {
    requestAnimationFrame(function() {
      tOverlay.classList.add('clear');
      setTimeout(function() { page.classList.add('visible'); }, 100);
    });
  });

  // ── Project detail rendering (identical to portfolio.html) ──
  var projectOverlay = document.getElementById('project-overlay');
  var pdExpanded  = document.getElementById('pd-expanded');
  var pdCollapsed = document.getElementById('pd-collapsed');
  var pdToggleBtn = document.getElementById('pd-toggle-btn');
  var pdBack      = document.getElementById('pd-back');
  var pdCloseText = document.getElementById('pd-close-text');
  var aboutOpen   = false;

  function renderMetaGrid(targetEl, meta) {
    targetEl.innerHTML = '';
    meta.forEach(function(m) {
      var col = document.createElement('div');
      var lbl = document.createElement('div'); lbl.className = 'pd-meta-label'; lbl.textContent = m.label;
      var val = document.createElement('div'); val.className = 'pd-meta-value'; val.textContent = m.value;
      col.appendChild(lbl); col.appendChild(val);
      targetEl.appendChild(col);
    });
  }

  var VIDEO_EXTENSIONS = ['mp4', 'webm', 'mov', 'm4v'];
  function isVideoSrc(src) {
    var clean = (src || '').split('?')[0].split('#')[0];
    var ext = clean.split('.').pop().toLowerCase();
    return VIDEO_EXTENSIONS.indexOf(ext) !== -1;
  }
  function createMediaEl(src) {
    if (isVideoSrc(src)) {
      var video = document.createElement('video');
      video.src = src;
      video.autoplay = true;
      video.loop = true;
      video.muted = true;
      video.playsInline = true;
      video.setAttribute('autoplay', '');
      video.setAttribute('playsinline', '');
      video.setAttribute('muted', '');
      return video;
    }
    var img = document.createElement('img');
    img.src = src; img.alt = '';
    return img;
  }
  function normalizeMediaEntry(entry) {
    if (typeof entry === 'string') return { src: entry, caption: '', link: '' };
    return {
      src: (entry && entry.src) || '',
      caption: (entry && entry.caption) || '',
      link: (entry && entry.link) || ''
    };
  }
  function wrapMediaWithLink(mediaEl, entry) {
    if (!entry.link) return mediaEl;
    var isExternal = /^https?:\/\//i.test(entry.link);
    var a = document.createElement('a');
    a.href = entry.link;
    if (isExternal) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    a.className = 'pd-media-link';
    a.style.cursor = 'none';
    a.addEventListener('click', function(e) { e.stopPropagation(); });
    a.appendChild(mediaEl);
    var badge = document.createElement('div');
    badge.className = 'pd-media-link-badge';
    badge.textContent = isExternal ? '\u2197' : '\u2192';
    a.appendChild(badge);
    return a;
  }

  function renderImages(targetEl, images, wrapClass) {
    targetEl.innerHTML = '';
    if (images && images.length) {
      images.forEach(function(rawEntry) {
        var entry = normalizeMediaEntry(rawEntry);
        if (!entry.src) return;
        var wrap = document.createElement('div'); wrap.className = wrapClass;
        wrap.appendChild(wrapMediaWithLink(createMediaEl(entry.src), entry));
        targetEl.appendChild(wrap);
        if (entry.caption) {
          var cap = document.createElement('div');
          cap.className = 'pd-media-caption';
          cap.textContent = entry.caption;
          targetEl.appendChild(cap);
        }
      });
    } else {
      var wrap = document.createElement('div'); wrap.className = wrapClass + ' empty';
      wrap.textContent = 'project image';
      targetEl.appendChild(wrap);
    }
  }

  function renderFirstImage(targetEl, images) {
    targetEl.innerHTML = '';
    var wrap = document.createElement('div');
    var entry = images && images.length ? normalizeMediaEntry(images[0]) : null;
    if (entry && entry.src) {
      wrap.className = 'pd-exp-img-wrap';
      wrap.appendChild(wrapMediaWithLink(createMediaEl(entry.src), entry));
    } else {
      wrap.className = 'pd-exp-img-wrap empty';
      wrap.textContent = 'project image';
    }
    targetEl.appendChild(wrap);
    if (entry && entry.caption) {
      var cap = document.createElement('div');
      cap.className = 'pd-media-caption';
      cap.textContent = entry.caption;
      targetEl.appendChild(cap);
    }
  }

  function renderRestImages(targetEl, images) {
    targetEl.innerHTML = '';
    if (!images || images.length < 2) return;
    images.slice(1).forEach(function(rawEntry) {
      var entry = normalizeMediaEntry(rawEntry);
      if (!entry.src) return;
      var container = document.createElement('div');
      var wrap = document.createElement('div'); wrap.className = 'pd-rest-img-wrap';
      wrap.appendChild(wrapMediaWithLink(createMediaEl(entry.src), entry));
      container.appendChild(wrap);
      if (entry.caption) {
        var cap = document.createElement('div');
        cap.className = 'pd-media-caption';
        cap.textContent = entry.caption;
        container.appendChild(cap);
      }
      targetEl.appendChild(container);
    });
  }

  function linkifyInto(container, text) {
    var urlRegex = /(https?:\/\/[^\s]+)/g;
    var lastIndex = 0, match;
    while ((match = urlRegex.exec(text)) !== null) {
      if (match.index > lastIndex) container.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
      var a = document.createElement('a');
      a.href = match[0]; a.textContent = match[0];
      a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.className = 'pd-inline-link';
      a.style.cursor = 'none';
      container.appendChild(a);
      lastIndex = match.index + match[0].length;
    }
    if (lastIndex < text.length) container.appendChild(document.createTextNode(text.slice(lastIndex)));
  }

  function renderSections(targetEl, proj) {
    targetEl.innerHTML = '';
    proj.sections.forEach(function(sec) {
      var s = document.createElement('div'); s.className = 'pd-section';
      var lbl = document.createElement('div'); lbl.className = 'pd-section-label'; lbl.textContent = sec.label;
      s.appendChild(lbl);
      if (sec.lede) { var l = document.createElement('div'); l.className = 'pd-section-lede'; l.textContent = sec.lede; s.appendChild(l); }
      if (sec.body) {
        sec.body.forEach(function(b) {
          var p = document.createElement('div'); p.className = 'pd-section-body'; linkifyInto(p, b); s.appendChild(p);
        });
      }
      if (sec.pullQuote) { var pq = document.createElement('div'); pq.className = 'pd-pull-quote'; pq.textContent = sec.pullQuote; s.appendChild(pq); }
      if (sec.prompt) { var pr = document.createElement('div'); pr.className = 'pd-prompt'; pr.textContent = sec.prompt; s.appendChild(pr); }
      targetEl.appendChild(s);
    });
    if (proj.blogLink) {
      var bl = document.createElement('div'); bl.className = 'pd-blog-link'; bl.textContent = proj.blogLink;
      targetEl.appendChild(bl);
    }
  }

  function openProjectDetail(proj) {
    document.getElementById('pd-title').textContent = proj.name;
    document.getElementById('pd-col-title').textContent = proj.name;
    renderMetaGrid(document.getElementById('pd-meta-grid'), proj.meta);
    renderMetaGrid(document.getElementById('pd-col-meta-grid'), proj.meta);

    renderFirstImage(document.getElementById('pd-exp-first-image'), proj.images);
    var existingQuote = document.getElementById('pd-quote-inline');
    if (existingQuote) existingQuote.remove();
    if (proj.quote) {
      var q = document.createElement('div'); q.className = 'pd-quote'; q.id = 'pd-quote-inline'; q.textContent = proj.quote;
      document.getElementById('pd-exp-first-image').insertAdjacentElement('afterend', q);
    }
    renderRestImages(document.getElementById('pd-exp-rest-images'), proj.images);

    renderImages(document.getElementById('pd-col-images'), proj.images, 'pd-col-img-wrap');

    var rightContent = document.getElementById('pd-text-content');
    rightContent.innerHTML = '';
    if (proj.quote) {
      var q2 = document.createElement('div'); q2.id = 'pd-col-quote'; q2.textContent = proj.quote;
      rightContent.appendChild(q2);
    }
    renderSections(rightContent, proj);

    pdExpanded.classList.remove('hidden');
    pdCollapsed.classList.remove('active');
    pdToggleBtn.classList.remove('active');
    pdToggleBtn.style.display = '';
    aboutOpen = false;

    projectOverlay.classList.add('show');
  }

  function closeProjectDetail() {
    projectOverlay.classList.remove('show');
  }

  function toggleAboutProject() {
    aboutOpen = !aboutOpen;
    if (aboutOpen) {
      pdExpanded.classList.add('hidden');
      pdCollapsed.classList.add('active');
      pdToggleBtn.classList.add('active');
      pdToggleBtn.style.display = 'none';
    } else {
      pdExpanded.classList.remove('hidden');
      pdCollapsed.classList.remove('active');
      pdToggleBtn.classList.remove('active');
      pdToggleBtn.style.display = '';
    }
  }

  pdToggleBtn.addEventListener('click', function(e) { e.stopPropagation(); toggleAboutProject(); });
  pdCloseText.addEventListener('click', function(e) { e.stopPropagation(); toggleAboutProject(); });
  pdBack.addEventListener('click', function(e) { e.stopPropagation(); closeProjectDetail(); });

  // Card clicks -> open the same project detail template
  (function buildProjGrid() {
    var PAGE_ROLE = 'vd';
    var grid = document.getElementById('proj-grid');
    grid.innerHTML = '';
    Object.keys(PROJECTS).forEach(function(id) {
      var proj = PROJECTS[id];
      if (!proj || proj.roles.indexOf(PAGE_ROLE) === -1) return;

      var card = document.createElement('div');
      card.className = 'proj-card';
      card.dataset.id = id;
      card.tabIndex = 0;
      card.setAttribute('role', 'button');
      card.setAttribute('aria-label', proj.name);
      card.style.cursor = 'none';

      var thumbWrap = document.createElement('div');
      thumbWrap.className = 'card-thumb';
      if (proj.thumb) {
        var img = document.createElement('img');
        img.src = proj.thumb; img.alt = proj.name;
        thumbWrap.appendChild(img);
      } else {
        var ph = document.createElement('div');
        ph.className = 'card-placeholder';
        ph.textContent = proj.name;
        thumbWrap.appendChild(ph);
      }
      card.appendChild(thumbWrap);

      var nameEl = document.createElement('div');
      nameEl.className = 'card-name';
      nameEl.textContent = proj.name;
      card.appendChild(nameEl);

      card.addEventListener('click', function() { openProjectDetail(proj); });
      card.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault(); openProjectDetail(proj);
        }
      });

      grid.appendChild(card);
    });
  })();

  // ── Hamburger ──
  (function() {
    var mb = document.getElementById('menu-btn');
    var nd = document.getElementById('nav-dropdown');
    var nw = document.getElementById('nav-work');
    var ws = document.getElementById('work-subpages');
    var na = document.getElementById('nav-about');
    var as_ = document.getElementById('about-subpages');
    var navAboutLabel = document.getElementById('nav-about-label');
    function setWorkSubpagesOpen(isOpen) {
      ws.style.maxHeight = isOpen ? (ws.scrollHeight + 'px') : '0px';
      ws.classList.toggle('open', isOpen);
      navWorkLabel.textContent = isOpen ? '- work' : '+ work';
    }
    function setAboutSubpagesOpen(isOpen) {
      as_.style.maxHeight = isOpen ? (as_.scrollHeight + 'px') : '0px';
      as_.classList.toggle('open', isOpen);
      navAboutLabel.textContent = isOpen ? '- about' : '+ about';
    }
    var expanded = false, aboutExpanded = false, menuOpen = false;
    mb.addEventListener('click', function(e) {
      e.stopPropagation();
      menuOpen = !menuOpen;
      mb.classList.toggle('open', menuOpen);
      nd.classList.toggle('open', menuOpen);
      if (!menuOpen) { expanded = false; aboutExpanded = false; setWorkSubpagesOpen(false); setAboutSubpagesOpen(false); }
    });
    var navWorkLabel = document.getElementById('nav-work-label');
    nw.addEventListener('click', function(e) {
      e.stopPropagation();
      expanded = !expanded;
      setWorkSubpagesOpen(expanded);
    });
    nw.addEventListener('dblclick', function(e) {
      e.stopPropagation();
      window.location.href = 'portfolio.html';
    });
    na.addEventListener('click', function(e) {
      e.stopPropagation();
      aboutExpanded = !aboutExpanded;
      setAboutSubpagesOpen(aboutExpanded);
    });
    na.addEventListener('dblclick', function(e) {
      e.stopPropagation();
      window.location.href = 'about.html';
    });
    nd.addEventListener('click', function(e) { e.stopPropagation(); });
    document.addEventListener('click', function() {
      menuOpen = false; expanded = false; aboutExpanded = false;
      mb.classList.remove('open'); nd.classList.remove('open'); setWorkSubpagesOpen(false); setAboutSubpagesOpen(false);
    });
  })();
</script>
</body>
</html>
