<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Janani</title>
  <link rel="icon" type="image/svg+xml" href="janani-portfolio/assets/icons/favicon.svg">
  <link rel="icon" type="image/x-icon" href="janani-portfolio/favicon.ico">
  <link rel="apple-touch-icon" href="janani-portfolio/assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; }
    :root { --bg:#ff7d3c; --fg:#fff; }
    body.dark { --bg:#1e1e1e; }
    body.intro-settled { --bg:#162b04; transition:background 2.8s ease; }
    body.dark.intro-settled { --bg:#1e1e1e; }
    body { background:var(--bg); font-family:'Inter',sans-serif; cursor:none; transition:background 0.4s; }

    /* Cursor */
    #cursor {
      position:fixed; left:-100px; top:-100px; width:28px; height:28px; border-radius:50%;
      background:rgba(255,255,255,0.5); pointer-events:none;
      transform:translate(-50%,-50%); z-index:9999;
      transition:background 0.4s ease;
    }
    #cursor.clicked    { opacity:0; transition:opacity 0s; }
    #cursor.recovering { opacity:1; transition:opacity 0.15s ease; }
    #cursor.hot-pink    { background:rgba(255,62,138,0.75); }
    #home-btn {
      position:fixed; top:16px; left:16px; z-index:8600;
      width:32px; height:32px; border-radius:50%;
      background:rgba(255,255,255,0.15); cursor:none;
      display:flex; align-items:center; justify-content:center;
      transition:background 0.2s ease;
    }
    #home-btn:hover { background:rgba(255,255,255,0.25); }
    #home-btn-shape {
      display:inline-block; width:0; height:0;
      border-left:6px solid transparent; border-right:6px solid transparent;
      border-bottom:10px solid var(--fg);
    }
    #home-btn:hover #home-btn-shape { animation:home-btn-spin 0.7s linear infinite; }
    @keyframes home-btn-spin {
      from { transform:rotate(0deg); }
      to   { transform:rotate(360deg); }
    }
    @keyframes home-btn-pop {
      0%   { transform:scale(1) rotate(0deg); opacity:1; }
      20%  { transform:scale(1.35) rotate(0deg); opacity:1; }
      45%  { transform:scale(0.05) rotate(0deg); opacity:0.7; }
      100% { transform:scale(0) rotate(0deg); opacity:0; }
    }
    #home-btn.popping #home-btn-shape { animation:home-btn-pop 0.38s cubic-bezier(0.55,0.06,0.68,0.19) forwards; }

    /* Intro */
    #intro-frame {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      z-index:10; transition:opacity 0.6s ease;
    }
    #intro-frame.hidden { opacity:0; pointer-events:none; }
    #greeting {
      font-weight:500; font-size:40px; color:#fff;
      letter-spacing:-2px; white-space:nowrap; user-select:none;
    }
    #greeting::after { content:'|'; margin-left:1px; animation:blink 0.75s step-end infinite; }
    #greeting.no-cursor::after { display:none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .wave-char { display:inline-block; animation:wave 0.45s ease forwards; }
    @keyframes wave {
      0%   { transform:scaleY(0.4); opacity:0.3; }
      40%  { transform:scaleY(1.55); }
      70%  { transform:scaleY(0.88); }
      100% { transform:scaleY(1); opacity:1; }
    }

    /* Gallery grid */
    #gallery-section {
      position:fixed; inset:0; z-index:5;
      overflow:hidden; opacity:0; pointer-events:none; transition:opacity 0.3s ease;
      background:#fa344f;
    }
    #gallery-section.active { opacity:1; pointer-events:all; }

    /* Bottom layer: the grid of decorative pictures, fully drawn and always
       present on its pink background - only ever visible where the green
       layer above it has been scratched away. */
    #picture-canvas {
      position:absolute; inset:0; z-index:1;
      width:100%; height:100%; display:block;
    }

    /* Top layer: solid green, seamlessly continuing the body's own
       orange-to-green transition. The cursor erases through this to reveal
       the picture grid underneath. */
    #erase-canvas {
      position:absolute; inset:0; z-index:2;
      width:100%; height:100%; display:block; cursor:none;
    }

    #proceed-hint {
      position:fixed; bottom:36px; left:50%; transform:translateX(-50%);
      font-size:13px; font-weight:500; color:rgba(255,255,255,0.5);
      letter-spacing:-0.3px; z-index:20; opacity:0; transition:opacity 0.6s ease; pointer-events:none;
    }
    #proceed-hint.visible { opacity:1; }

    #skip-intro {
      position:fixed; bottom:36px; right:44px; z-index:8600;
      font-size:13px; font-weight:500; color:rgba(255,255,255,0.55);
      letter-spacing:-0.3px; cursor:none;
      padding:9px 16px; border:1.5px solid rgba(255,255,255,0.35); border-radius:99px;
      background:rgba(255,255,255,0.08);
      opacity:0; transition:opacity 0.4s ease, background 0.2s ease, color 0.2s ease;
      pointer-events:none;
    }
    #skip-intro.visible { opacity:1; pointer-events:all; }
    #skip-intro:hover { background:rgba(255,255,255,0.16); color:#fff; }

    /* Hamburger - hidden until animation ends */
    #menu-btn {
      position:fixed; top:36px; right:44px; z-index:8600; cursor:none;
      display:flex; flex-direction:column; gap:6px; padding:8px;
      opacity:0; pointer-events:none; transition:opacity 0.45s ease;
    }
    #menu-btn.visible { opacity:1; pointer-events:all; }
    #menu-btn span {
      display:block; width:28px; height:2.5px;
      background:var(--fg,#fff); border-radius:99px;
      transition:transform 0.3s, opacity 0.3s; transform-origin:center;
    }
    #menu-btn.open span:nth-child(1) { transform:translateY(8.5px) rotate(45deg); }
    #menu-btn.open span:nth-child(2) { opacity:0; transform:scaleX(0); }
    #menu-btn.open span:nth-child(3) { transform:translateY(-8.5px) rotate(-45deg); }

    #nav-dropdown {
      position:fixed; top:92px; right:44px; z-index:8500;
      display:flex; flex-direction:column; align-items:flex-end;
      pointer-events:none; opacity:0; transform:translateY(-8px);
      transition:opacity 0.25s, transform 0.25s;
    }
    #nav-dropdown.open { opacity:1; transform:translateY(0); pointer-events:all; }
    .nav-item {
      font-weight:500; font-size:28px; color:var(--fg,#fff);
      letter-spacing:-1.4px; text-transform:lowercase; line-height:1.25;
      cursor:none; text-decoration:none; opacity:0.9; transition:opacity 0.15s;
    }
    .nav-item:hover, .nav-item.current { opacity:1; }
    #work-subpages {
      display:flex; flex-direction:column; align-items:flex-end;
      overflow:hidden; max-height:0; opacity:0;
      transition:max-height 0.35s ease, opacity 0.3s ease;
    }
    #work-subpages.open { max-height:220px; opacity:1; }
    #about-subpages { display:flex; flex-direction:column; align-items:flex-end; overflow:hidden; max-height:0; opacity:0; transition:max-height 0.35s ease,opacity 0.3s ease; }
    #about-subpages.open { opacity:1; }
    .sub-item {
      font-weight:500; font-size:19px; color:var(--fg,#fff);
      letter-spacing:-0.9px; text-transform:lowercase; line-height:1.35;
      cursor:none; text-decoration:none; opacity:0.6; transition:opacity 0.15s;
    }
    .sub-item:hover { opacity:1; }
    .nav-triangle {
      display:inline-block; width:0; height:0;
      border-left:6px solid transparent; border-right:6px solid transparent;
      border-bottom:9px solid var(--fg);
      flex-shrink:0;
    }
    @keyframes nav-triangle-pop {
      0%   { transform:scale(1); }
      40%  { transform:scale(1.7); }
      70%  { transform:scale(0.82); }
      100% { transform:scale(1); }
    }
    .nav-triangle.pop { animation:nav-triangle-pop 0.4s cubic-bezier(0.34,1.56,0.64,1); }


    /* Dark toggle */
    #dark-toggle {
      position:fixed; bottom:36px; right:44px; z-index:8600; cursor:none;
      width:36px; height:20px; background:rgba(255,255,255,0.25); border-radius:99px;
      opacity:0; pointer-events:none; transition:opacity 0.45s, background 0.3s;
    }
    #dark-toggle.visible { opacity:1; pointer-events:all; }
    #dark-toggle::after {
      content:''; position:absolute; width:14px; height:14px;
      border-radius:50%; background:#fff; top:3px; left:3px; transition:transform 0.3s;
    }
    body.dark #dark-toggle { background:rgba(255,125,60,0.5); }
    body.dark #dark-toggle::after { transform:translateX(16px); }

    #site-copyright {
      position:fixed; bottom:36px; left:54px; z-index:30;
      font-size:11px; font-weight:400; color:rgba(255,255,255,0.3);
      letter-spacing:-0.1px; pointer-events:none;
      opacity:0; transition:opacity 0.45s;
    }
    #site-copyright.visible { opacity:1; }
    body.dark #site-copyright { color:rgba(255,255,255,0.2); }

    /* Transition overlay */
    #t-overlay {
      position:fixed; inset:0; background:var(--bg);
      opacity:0; pointer-events:none; z-index:8888; transition:opacity 0.5s;
    }
    #t-overlay.active { opacity:1; pointer-events:all; }
    @media (prefers-reduced-motion: reduce) {
      #home-btn:hover #home-btn-shape { animation:none; }
      #home-btn.popping #home-btn-shape { animation:none; }
      .nav-triangle.pop { animation:none; }
    }
    #home-btn:focus-visible, #menu-btn:focus-visible, #dark-toggle:focus-visible {
      outline:2px solid #fff; outline-offset:3px; border-radius:4px;
    }
  </style>
<script src="janani-portfolio/projects-data.js"></script>
</head>
<body>
  <div id="cursor"></div>
<div id="home-btn" style="cursor:none;" tabindex="0" role="button" aria-label="Go to work diagram"><span id="home-btn-shape"></span></div>
  <div id="t-overlay"></div>

  <!-- Hamburger - always in DOM, visibility controlled by .visible class -->
  <div id="menu-btn" tabindex="0" role="button" aria-label="Open menu"><span></span><span></span><span></span></div>
  <nav id="nav-dropdown">
    <span class="nav-item" id="nav-work" style="cursor:none; display:inline-flex; align-items:center; gap:8px;"><span id="nav-work-label" style="cursor:none;">+ work</span></span>
    <div id="work-subpages">
      <a class="sub-item" href="janani-portfolio/work-vd.html">visual systems design</a>
      <a class="sub-item" href="janani-portfolio/work-dr.html">design research</a>
      <a class="sub-item" href="janani-portfolio/work-sms.html">content strategy</a>
    </div>
    <span class="nav-item" id="nav-about" style="cursor:none; display:inline-flex; align-items:center; gap:8px;"><span id="nav-about-label" style="cursor:none;">+ about</span></span>
  <div id="about-subpages">
    <a class="sub-item" href="janani-portfolio/about.html#resume-section">resume</a>
  </div>
    <a class="nav-item" href="janani-portfolio/contact.html">contact</a>
  </nav>
  <div id="dark-toggle" tabindex="0" role="button" aria-label="Toggle dark mode"></div>
  <div id="site-copyright">2026 Janani. All rights reserved.</div>

  <div id="intro-frame"><span id="greeting"></span></div>
  <div id="gallery-section">
    <canvas id="picture-canvas"></canvas>
    <canvas id="erase-canvas"></canvas>
  </div>
  <div id="proceed-hint">click anywhere to continue</div>
  <div id="skip-intro">click to skip</div>

<script>
  // Always restart from scratch on reload
  if (performance.getEntriesByType('navigation')[0]?.type === 'back_forward') {
    window.location.reload();
  }

  // ── State flags ──
  var animationDone = false;  // true once gallery is fully shown
  var menuIsOpen    = false;
  var workExpanded  = false;
  var aboutExpanded = false;

  // ── Elements ──
  var cursor       = document.getElementById('cursor');
  var homeBtn = document.getElementById('home-btn');
  homeBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    homeBtn.classList.add('popping');
    setTimeout(function() { navigateTo('janani-portfolio/portfolio.html'); }, 380);
  });
  var darkToggle   = document.getElementById('dark-toggle');
  var siteCopyright = document.getElementById('site-copyright');
  var menuBtn      = document.getElementById('menu-btn');
  var navDropdown  = document.getElementById('nav-dropdown');
  var navWork      = document.getElementById('nav-work');
  var workSubpages = document.getElementById('work-subpages');
  var navAbout      = document.getElementById('nav-about');
  var aboutSubpages = document.getElementById('about-subpages');
  function setWorkSubpagesOpen(isOpen) {
    workSubpages.style.maxHeight = isOpen ? (workSubpages.scrollHeight + 'px') : '0px';
    workSubpages.classList.toggle('open', isOpen);
    navWorkLabel.textContent = isOpen ? '- work' : '+ work';
  }
  function setAboutSubpagesOpen(isOpen) {
    aboutSubpages.style.maxHeight = isOpen ? (aboutSubpages.scrollHeight + 'px') : '0px';
    aboutSubpages.classList.toggle('open', isOpen);
    navAboutLabel.textContent = isOpen ? '- about' : '+ about';
  }
  var overlay      = document.getElementById('t-overlay');
  var introFrame   = document.getElementById('intro-frame');
  var gallerySection = document.getElementById('gallery-section');
  var pictureCanvas = document.getElementById('picture-canvas');
  var pictureCtx    = pictureCanvas.getContext('2d');
  var eraseCanvas   = document.getElementById('erase-canvas');
  var eraseCtx      = eraseCanvas.getContext('2d');
  var proceedHint  = document.getElementById('proceed-hint');
  var skipIntro    = document.getElementById('skip-intro');
  var greeting     = document.getElementById('greeting');

  // ── Theme ──
  if (localStorage.getItem('dark') === '1') document.body.classList.add('dark');
function addKeyboardActivation(el) {
  if (!el) return;
  el.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      el.click();
    }
  });
}
['dark-toggle', 'home-btn', 'menu-btn'].forEach(function(id) { addKeyboardActivation(document.getElementById(id)); });

  darkToggle.addEventListener('click', function(e) {
    e.stopPropagation();
    document.body.classList.toggle('dark');
    localStorage.setItem('dark', document.body.classList.contains('dark') ? '1' : '0');
  });

  skipIntro.addEventListener('click', function(e) {
    e.stopPropagation();
    navigateTo('janani-portfolio/portfolio.html');
  });

  // ── Cursor ──
  var mouseX = 0, mouseY = 0;
  var eraseLastX = null, eraseLastY = null;
  var ERASE_BRUSH_RADIUS = 42;

  function eraseAt(x, y) {
    if (!gallerySection.classList.contains('active')) return;
    eraseCtx.globalCompositeOperation = 'destination-out';
    if (eraseLastX !== null) {
      eraseCtx.lineWidth = ERASE_BRUSH_RADIUS * 2;
      eraseCtx.lineCap = 'round';
      eraseCtx.beginPath();
      eraseCtx.moveTo(eraseLastX, eraseLastY);
      eraseCtx.lineTo(x, y);
      eraseCtx.stroke();
    } else {
      eraseCtx.beginPath();
      eraseCtx.arc(x, y, ERASE_BRUSH_RADIUS, 0, Math.PI * 2);
      eraseCtx.fill();
    }
    eraseCtx.globalCompositeOperation = 'source-over';
    eraseLastX = x; eraseLastY = y;
  }

  document.addEventListener('mousemove', function(e) {
    mouseX = e.clientX; mouseY = e.clientY;
    cursor.style.left = mouseX + 'px';
    cursor.style.top  = mouseY + 'px';
    eraseAt(mouseX, mouseY);
  });
  document.addEventListener('mouseleave', function() {
    eraseLastX = null; eraseLastY = null;
  });
  document.addEventListener('touchmove', function(e) {
    if (!e.touches || !e.touches.length) return;
    var t = e.touches[0];
    eraseAt(t.clientX, t.clientY);
  }, { passive:true });
  document.addEventListener('touchend', function() {
    eraseLastX = null; eraseLastY = null;
  });
  document.addEventListener('mousedown', function() {
    cursor.classList.remove('recovering');
    cursor.classList.add('clicked');
    requestAnimationFrame(function() { requestAnimationFrame(function() {
      cursor.classList.remove('clicked');
      cursor.classList.add('recovering');
    }); });
  });

  var navWorkLabel = document.getElementById('nav-work-label');
  var navAboutLabel = document.getElementById('nav-about-label');

  // ── Hamburger ──
  // Hamburger button click - toggle menu open/closed
  menuBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    menuIsOpen = !menuIsOpen;
    menuBtn.classList.toggle('open', menuIsOpen);
    navDropdown.classList.toggle('open', menuIsOpen);
    if (!menuIsOpen) { workExpanded = false; aboutExpanded = false; setWorkSubpagesOpen(false); setAboutSubpagesOpen(false); }
  });

  // + work click - toggles the subpages list open/closed only
  navWork.addEventListener('click', function(e) {
    e.stopPropagation();
    workExpanded = !workExpanded;
    setWorkSubpagesOpen(workExpanded);
  });

  // Double-click "work", or click the triangle, to jump straight to the diagram
  navWork.addEventListener('dblclick', function(e) {
    e.stopPropagation();
    navigateTo('janani-portfolio/portfolio.html');
  });

  // + about click - toggles the resume sub-link open/closed only
  navAbout.addEventListener('click', function(e) {
    e.stopPropagation();
    aboutExpanded = !aboutExpanded;
    setAboutSubpagesOpen(aboutExpanded);
  });
  navAbout.addEventListener('dblclick', function(e) {
    e.stopPropagation();
    navigateTo('janani-portfolio/about.html');
  });

  // Sub-item links - don't close menu on click, just navigate
  workSubpages.addEventListener('click', function(e) {
    e.stopPropagation();
    // let the href do the navigation
  });

  // nav-item links (about, contact) - stop propagation so they don't trigger gallery click
  navDropdown.addEventListener('click', function(e) {
    e.stopPropagation();
  });

  // Click anywhere outside menu → close menu
  // Click anywhere on page (not menu) after animation → go to portfolio
  document.addEventListener('click', function(e) {
    var inMenu = menuBtn.contains(e.target) || navDropdown.contains(e.target);
    var inToggle = darkToggle.contains(e.target);

    // Close menu if open and clicking outside
    if (!inMenu) {
      menuIsOpen = false;
      workExpanded = false;
      aboutExpanded = false;
      menuBtn.classList.remove('open');
      navDropdown.classList.remove('open');
      setWorkSubpagesOpen(false);
      setAboutSubpagesOpen(false);
    }

    // Navigate to portfolio after animation is done, if not clicking menu/toggle
    if (animationDone && !inMenu && !inToggle) {
      navigateTo('janani-portfolio/portfolio.html');
    }
  });

  // ── Navigation ──
  function navigateTo(href) {
    overlay.classList.add('active');
    setTimeout(function() { window.location.href = href; }, 520);
  }

  // ── Typing helpers ──
  var pause = function(ms) { return new Promise(function(r) { setTimeout(r, ms); }); };

  function type(text, delay) {
    delay = delay || 90;
    return new Promise(function(resolve) {
      var i = 0; greeting.textContent = '';
      var tick = function() {
        if (i < text.length) { greeting.textContent += text[i++]; setTimeout(tick, delay); }
        else resolve();
      };
      tick();
    });
  }
  function erase(delay) {
    delay = delay || 60;
    return new Promise(function(resolve) {
      var tick = function() {
        if (greeting.textContent.length > 0) { greeting.textContent = greeting.textContent.slice(0,-1); setTimeout(tick, delay); }
        else resolve();
      };
      tick();
    });
  }
  function eraseNodes(n, delay) {
    delay = delay || 65;
    return new Promise(function(resolve) {
      var count = 0;
      var tick = function() {
        if (count >= n) { resolve(); return; }
        var last = greeting.lastChild;
        if (!last) { resolve(); return; }
        if (last.nodeType === Node.ELEMENT_NODE) { greeting.removeChild(last); count++; }
        else if (last.nodeType === Node.TEXT_NODE && last.textContent.length > 0) { last.textContent = last.textContent.slice(0,-1); count++; }
        else { greeting.removeChild(last); }
        setTimeout(tick, delay);
      };
      tick();
    });
  }
  function typeAppend(text, delay) {
    delay = delay || 90;
    return new Promise(function(resolve) {
      var i = 0;
      var tick = function() {
        if (i < text.length) { greeting.textContent += text[i++]; setTimeout(tick, delay); }
        else resolve();
      };
      tick();
    });
  }
  function typeWave(text, delay) {
    delay = delay || 90;
    return new Promise(function(resolve) {
      var i = 0;
      var tick = function() {
        if (i < text.length) {
          var span = document.createElement('span');
          span.className = 'wave-char';
          span.style.animationDelay = (i * 0.04) + 's';
          span.textContent = text[i++];
          greeting.appendChild(span);
          setTimeout(tick, delay);
        } else resolve();
      };
      tick();
    });
  }

  // ── Gallery ──
  // Uses the dedicated set of splash images (images/index/1.jpg...14.jpg) -
  // purely decorative, not tied to specific projects since these tiles
  // aren't clickable.
  var GALLERY_IMAGES = [];
  for (var gi = 1; gi <= 14; gi++) {
    GALLERY_IMAGES.push({ src: 'janani-portfolio/images/index/' + gi + '.jpg', label: '' });
  }

  var cellRects = [];
  var imageCache = {};
  var INTRO_GREEN = '#162b04';

  function sizeCanvas(canvas, ctx, dpr, W, H) {
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function resizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    var W = window.innerWidth, H = window.innerHeight;
    sizeCanvas(pictureCanvas, pictureCtx, dpr, W, H);
    sizeCanvas(eraseCanvas, eraseCtx, dpr, W, H);
    eraseCtx.fillStyle = INTRO_GREEN;
    eraseCtx.fillRect(0, 0, W, H);
  }

  function computeGridLayout() {
    var W = window.innerWidth, H = window.innerHeight;
    var COLS = Math.max(3, Math.floor(W / 280));
    var cellW = (W - 12 * (COLS + 1)) / COLS;
    var cellH = cellW * (10 / 16);
    var ROWS = Math.ceil((H - 12) / (cellH + 12));
    var total = COLS * ROWS;
    cellRects = [];
    for (var i = 0; i < total; i++) {
      var col = i % COLS, row = Math.floor(i / COLS);
      cellRects.push({
        x: 12 + col * (cellW + 12),
        y: 12 + row * (cellH + 12),
        w: cellW, h: cellH,
        item: GALLERY_IMAGES[i % GALLERY_IMAGES.length]
      });
    }
  }

  function roundedRectPath(ctx, x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawImageCover(ctx, img, x, y, w, h) {
    var iw = img.naturalWidth, ih = img.naturalHeight;
    var scale = Math.max(w / iw, h / ih);
    var sw = w / scale, sh = h / scale;
    var sx = (iw - sw) / 2, sy = (ih - sh) / 2;
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }

  function wrapAndDrawLabel(ctx, text, cx, cy, maxWidth, lineHeight) {
    var words = text.split(' ');
    var lines = [], line = '';
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = words[i]; }
      else { line = test; }
    }
    if (line) lines.push(line);
    var startY = cy - (lines.length - 1) * lineHeight / 2;
    lines.forEach(function(l, i) { ctx.fillText(l, cx, startY + i * lineHeight); });
  }

  function drawCell(cell) {
    pictureCtx.save();
    pictureCtx.beginPath();
    roundedRectPath(pictureCtx, cell.x, cell.y, cell.w, cell.h, 10);
    pictureCtx.clip();

    var img = cell.item.src ? imageCache[cell.item.src] : null;
    if (img && img.complete && img.naturalWidth) {
      drawImageCover(pictureCtx, img, cell.x, cell.y, cell.w, cell.h);
    } else {
      pictureCtx.fillStyle = '#ffd7d7';
      pictureCtx.fillRect(cell.x, cell.y, cell.w, cell.h);
      if (!cell.item.src) {
        pictureCtx.fillStyle = 'rgba(0,0,0,0.3)';
        pictureCtx.font = '500 11px Inter, sans-serif';
        pictureCtx.textAlign = 'center';
        pictureCtx.textBaseline = 'middle';
        wrapAndDrawLabel(pictureCtx, cell.item.label, cell.x + cell.w/2, cell.y + cell.h/2, cell.w - 24, 14);
      }
    }
    pictureCtx.restore();
  }

  function preloadImages() {
    var srcs = [];
    GALLERY_IMAGES.forEach(function(g) { if (g.src && srcs.indexOf(g.src) === -1) srcs.push(g.src); });
    srcs.forEach(function(src) {
      if (imageCache[src]) return;
      var img = new Image();
      img.onload = function() {
        // Redraw every cell using this image, in case it finished loading
        // after that cell was already drawn as a placeholder.
        cellRects.forEach(function(cell) { if (cell.item.src === src) drawCell(cell); });
      };
      img.src = src;
      imageCache[src] = img;
    });
  }

  function buildGrid() {
    resizeCanvas();
    computeGridLayout();
    cellRects.forEach(function(cell) { drawCell(cell); });
    preloadImages();
  }

  async function animateGridIn() {
    await pause(200);
    proceedHint.classList.add('visible');
  }

  var galleryResizeTimer = null;
  window.addEventListener('resize', function() {
    clearTimeout(galleryResizeTimer);
    galleryResizeTimer = setTimeout(function() {
      if (!gallerySection.classList.contains('active')) return;
      buildGrid();
    }, 150);
  });

  // ── Main animation sequence ──
  async function run() {
    skipIntro.classList.add('visible');
    await pause(500);

    // Hi!
    await type('Hi!', 110);
    await pause(950);
    await erase(65);
    await pause(280);

    // I'm Janoooni -> I'm Janani
    await typeAppend("I'm ", 85);
    await typeWave("Janoooni", 88);
    await pause(750);
    await eraseNodes(5, 68);
    await pause(130);
    await typeAppend('ani', 95);
    await pause(900);

    // Reveal menu, begin the slow orange -> green transition
    greeting.classList.add('no-cursor');
    menuBtn.classList.add('visible');
    darkToggle.classList.add('visible');
    siteCopyright.classList.add('visible');
    document.body.classList.add('intro-settled');

    // Let the background finish settling into green before anything else happens
    await pause(2800);
    cursor.classList.add('hot-pink');
    await pause(200);

    // Show gallery: solid green on top, the picture grid hidden underneath
    // it until the cursor scratches through
    introFrame.classList.add('hidden');
    buildGrid();
    gallerySection.classList.add('active');
    await animateGridIn();

    // Now clicking anywhere on the page goes to portfolio
    animationDone = true;
    skipIntro.classList.remove('visible');
  }

  run();
</script>
</body>
