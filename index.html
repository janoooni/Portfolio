<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Janani — Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background-color: #ff7d3c;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Cursor blink */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* Fade in for final state */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    #greeting {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 40px;
      color: #ffffff;
      letter-spacing: -2px;
      text-align: center;
      white-space: nowrap;
      line-height: normal;
      /* keep it non-interactive until the final state */
      user-select: none;
      position: relative;
    }

    #greeting::after {
      content: '|';
      display: inline-block;
      margin-left: 1px;
      animation: blink 0.75s step-end infinite;
      opacity: 1;
    }

    /* Hide cursor once done */
    #greeting.no-cursor::after {
      display: none;
    }

    /* Make the text a link only in final state */
    #greeting.final {
      cursor: pointer;
      text-decoration: none;
      animation: fadeIn 0.2s ease;
    }

    #greeting.final:hover {
      opacity: 0.85;
      transition: opacity 0.2s ease;
    }
  </style>
</head>
<body>

  <span id="greeting" aria-live="polite"></span>

  <script>
    const el = document.getElementById('greeting');

    // --- Typewriter utility ---
    function type(text, delay = 90) {
      return new Promise(resolve => {
        let i = 0;
        el.textContent = '';
        const tick = () => {
          if (i < text.length) {
            el.textContent += text[i++];
            setTimeout(tick, delay);
          } else {
            resolve();
          }
        };
        tick();
      });
    }

    function erase(delay = 60) {
      return new Promise(resolve => {
        const tick = () => {
          const t = el.textContent;
          if (t.length > 0) {
            el.textContent = t.slice(0, -1);
            setTimeout(tick, delay);
          } else {
            resolve();
          }
        };
        tick();
      });
    }

    function pause(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    // --- Sequence ---
    // State 1 (node 19:2):  "Hi!"
    // State 2 (node 20:48): "I'm Janoooni"   (playful nickname)
    // State 3 (node 20:37): "I'm Janani"     (real name, becomes a link)

    async function run() {
      // State 1 — type "Hi!"
      await pause(400);
      await type('Hi!', 110);
      await pause(900);

      // Erase back to nothing
      await erase(70);
      await pause(300);

      // State 2 — type "I'm Janoooni"
      await type("I'm Janoooni", 85);
      await pause(700);

      // Erase "ooni" back to "I'm Jan"
      // "I'm Janoooni" has 12 chars; "I'm Jan" has 7, so erase 5
      await eraseN(5, 75);
      await pause(150);

      // retype correctly to "I'm Janani"
      await typeAppend('ani', 90);
      await pause(1200);

      // Remove cursor, convert to link (State 3 — node 20:37)
      el.classList.add('no-cursor', 'final');
      el.setAttribute('role', 'link');
      el.setAttribute('tabindex', '0');
      el.title = 'Enter portfolio';

      // Click / Enter navigates (wire up to your actual URL)
      el.addEventListener('click', () => {
        // Replace '#' with your portfolio's next page URL
        window.location.href = '#';
      });
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          window.location.href = '#';
        }
      });
    }

    // Erase exactly n characters
    function eraseN(n, delay = 60) {
      return new Promise(resolve => {
        let count = 0;
        const tick = () => {
          if (count < n && el.textContent.length > 0) {
            el.textContent = el.textContent.slice(0, -1);
            count++;
            setTimeout(tick, delay);
          } else {
            resolve();
          }
        };
        tick();
      });
    }

    // Append characters to existing text
    function typeAppend(text, delay = 90) {
      return new Promise(resolve => {
        let i = 0;
        const tick = () => {
          if (i < text.length) {
            el.textContent += text[i++];
            setTimeout(tick, delay);
          } else {
            resolve();
          }
        };
        tick();
      });
    }

    run();
  </script>
</body>
</html>
